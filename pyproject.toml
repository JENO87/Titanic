# Core project metadata (PEP 621). Defines package info for UV, pip, PyPI, GitHub Packages.
[project]
name = "titanic-classification"
version = "0.1.0"
description = "Python Project for classification of Titanic survival"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "python-dotenv",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "pyreadr>=0.5.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.0.0",
    "numpy>=1.26.0",
    "pytz>=2023.3",
    "seaborn>=0.13.0",
    "matplotlib",
    "loguru",
    "scikit-learn",
]

[project.optional-dependencies]
build = ["build>=1.0.0", "twine>=4.0.0"]
dev = [
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
    "nbdime>=3.0.0",
    "tqdm>=4.0.0",
    "pre-commit>=3.0.0",
    "docformatter>=1.7.7",
    "pandas-stubs>=2.0.0",
    "types-requests>=2.31.0.1",  # Type stubs for requests
    "types-seaborn>=0.13.0.20240401",
    "pydantic>=2.8.2",

]
test = [
    "mypy>=1.11.0",
    "pylint>=3.0.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.0.0",
]

#[project.scripts]
#download_data = "scripts.download_data"

[project.urls]
"Homepage" = "https://github.com/your-username/titanic-classification"
"Repository" = "https://github.com/your-username/titanic-classification"
"Issues" = "https://github.com/your-username/titanic-classification/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/titanic_classification/__init__.py"

[tool.uv]
package = true

# Mypy config for strict type checking
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
no_implicit_reexport = true
warn_return_any = true
# Overrides for untyped modules
[[tool.mypy.overrides]]
module = ["titanic_classification.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "titanic_classification.eda.suggest_transformations"
disable_error_code = "str-bytes-safe"
[[tool.mypy.overrides]]
module = ["loguru"]
ignore_missing_imports = true

# Pylint config
[tool.pylint.messages_control]
disable = [
    "import-error",
    "logging-fstring-interpolation",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
max-line-length = 120
fail-under = 9.0

# Ruff config for linting/formatting
[tool.ruff]
line-length = 120
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "D", "F", "UP", "SIM", "I", "W"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D106",
    "D401",
]
[tool.ruff.lint.isort]
known-first-party = ["titanic_classification"]
combine-as-imports = true
# Prefer | None over Optional[] for Python 3.10+
force-single-line = false
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--cov=titanic_classification --cov-report=xml"

[dependency-groups]
test = [
    "docformatter>=1.7.7",
]
