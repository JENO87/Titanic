name: Github Actions CI/CD Pipeline

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

env:
  RUNNER: ubuntu-latest
  CHECKOUT_ACTION: actions/checkout@v4
  UPLOAD_ARTIFACT: actions/upload-artifact@v4
  DOWNLOAD_ARTIFACT: actions/download-artifact@v4

jobs:
  install-dependencies:
    runs-on: ${{ env.RUNNER }}
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync

  linting:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Run pre-commit
        run: make pre-commit
      - name: Run linters
        run: make lint

  check-formatting:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Check formatting
        run: make format-check

  type-checking:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Run type checking
        run: make type-check

  unit-tests:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Run unit tests
        run: make test

  coverage-report:
    runs-on: ${{ env.RUNNER }}
    needs: [ install-dependencies ]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Generate coverage report
        run: make test
      - name: Archive coverage report
        uses: ${{ env.UPLOAD_ARTIFACT }}
        with:
          name: coverage-report
          path: coverage.xml

  artifact-upload:
    runs-on: ${{ env.RUNNER }}
    needs: [ install-dependencies ]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Generate coverage report
        run: make test
      - name: Upload artifacts
        uses: ${{ env.UPLOAD_ARTIFACT }}
        with:
          name: test-artifacts
          path: |
            coverage.xml
            report.xml

  security-scan:
    runs-on: ${{ env.RUNNER }}
    needs: [ install-dependencies ]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Export requirements
        run: make export
      - name: Install Trivy
        run: make install-trivy
      - name: Scan dependencies
        run: make scan-deps
      - name: Upload scan report
        uses: ${{ env.UPLOAD_ARTIFACT }}
        with:
          name: trivy-report
          path: trivy-report.json

  build-package:
    runs-on: ${{ env.RUNNER }}
    needs: [ install-dependencies, linting, check-formatting, type-checking, unit-tests ]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Build package
        run: make build
      - name: Upload artifacts
        uses: ${{ env.UPLOAD_ARTIFACT }}
        with:
          name: package
          path: dist/*

  export-requirements:
    runs-on: ${{ env.RUNNER }}
    needs: [build-package]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Export requirements
        run: make export
      - name: Upload requirements
        uses: ${{ env.UPLOAD_ARTIFACT }}
        with:
          name: requirements
          path: requirements.txt

  publish-package:
    runs-on: ${{ env.RUNNER }}
    needs: [ build-package ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Download artifacts
        uses: ${{ env.DOWNLOAD_ARTIFACT }}
        with:
          name: package
          path: dist/
      - name: Publish to GitHub Packages
        run: make publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker-image:
    runs-on: ${{ env.RUNNER }}
    needs: [ build-package, export-requirements ]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Download requirements
        uses: ${{ env.DOWNLOAD_ARTIFACT }}
        with:
          name: requirements
          path: .
      - name: Build Docker image
        run: make build-docker-image

  tag-docker-image:
    runs-on: ${{ env.RUNNER }}
    needs: [ build-docker-image ]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Tag Docker image
        run: make tag-docker-image
        env:
          TAG: ${{ github.sha }}

  push-docker-image:
    runs-on: ${{ env.RUNNER }}
    needs: [ tag-docker-image ]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: make push-docker-image
        env:
          TAG: ${{ github.sha }}

  clean-after-push:
    runs-on: ${{ env.RUNNER }}
    needs: [ push-docker-image ]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Clean Docker images
        run: make clean-docker-image
        env:
          TAG: ${{ github.sha }}
