name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Define reusable steps with YAML anchors
defaults:
  run:
    shell: bash

jobs:
  install-dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v4
      - &install-uv
        name: Install UV
        run: make install-uv
      - &sync-deps
        name: Sync dependencies
        run: make sync

  run-linters:
    name: Run Linters
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - &run-pre-commit
        name: Run pre-commit
        run: make pre-commit
      - &run-linters
        name: Run linters
        run: make lint

  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Check formatting
        run: make format-check

  run-type-checking:
    name: Run Type Checking
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Run type checking
        run: make type-check

  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Run unit tests
        run: make test

  generate-coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Generate coverage report
        run: make test
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            report.xml

  run-security-scan:
    name: Run Security Scan
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    continue-on-error: true
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Export requirements
        run: make export
      - name: Install Trivy
        run: make install-trivy
      - name: Scan dependencies
        run: make scan-deps
      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [install-dependencies, run-linters, check-formatting, run-type-checking, run-unit-tests]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Build package
        run: make build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*

  export-requirements:
    name: Export Requirements
    runs-on: ubuntu-latest
    needs: [build-package]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Export requirements
        run: make export
      - name: Upload requirements
        uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: requirements.txt

  publish-package:
    name: Publish Package
    runs-on: ubuntu-latest
    needs: [build-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/
      - name: Publish to GitHub Packages
        run: make publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-package, export-requirements]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Download requirements
        uses: actions/download-artifact@v4
        with:
          name: requirements
          path: .
      - name: Build Docker image
        run: make docker-build
        env:
          DOCKER_TAG: ${{ github.sha }}

  tag-docker:
    name: Tag Docker Image
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - *checkout
      - name: Tag Docker image
        run: make tag-docker
        env:
          TAG: ${{ github.sha }}

  push-docker:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [tag-docker]
    steps:
      - *checkout
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: make push-docker
        env:
          TAG: ${{ github.sha }}

  clean-after-push:
    name: Clean Docker Images
    runs-on: ubuntu-latest
    needs: [push-docker]
    steps:
      - *checkout
      - name: Clean Docker images
        run: make clean-docker
        env:
          TAG: ${{ github.sha }}
