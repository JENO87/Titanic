name: Github Actions CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  RUNNER: ubuntu-latest
  CHECKOUT_ACTION: actions/checkout@v4
  UPLOAD_ARTIFACT: actions/upload-artifact@v4

jobs:
  install-dependencies:
    runs-on: ${{ env.RUNNER }}
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync

  run-linters:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Run pre-commit
        run: make pre-commit
      - name: Run linters
        run: make lint

  check-formatting:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Check formatting
        run: make format-check

  run-type-checking:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Run type checking
        run: make type-check

  run-unit-tests:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Run unit tests
        run: make test

  generate-coverage-report:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Generate coverage report
        run: make test
      - name: Upload coverage report
        uses: ${{ env.UPLOAD_ARTIFACT }}
        with:
          name: test-artifacts
          path: |
            coverage.xml
            report.xml

  run-security-scan:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Export requirements
        run: make export
      - name: Install Trivy
        run: make install-trivy
      - name: Scan dependencies
        run: make scan-deps
      - name: Upload scan report
        uses: ${{ env.UPLOAD_ARTIFACT }}
        with:
          name: trivy-report
          path: trivy-report.json

  build-package:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies, run-linters, check-formatting, run-type-checking, run-unit-tests]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Build package
        run: make build
      - name: Upload artifacts
        uses: ${{ env.UPLOAD_ARTIFACT }}
        with:
          name: package
          path: dist/*

  export-requirements:
    runs-on: ${{ env.RUNNER }}
    needs: [build-package]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Export requirements
        run: make export
      - name: Upload requirements
        uses: ${{ env.UPLOAD_ARTIFACT }}
        with:
          name: requirements
          path: requirements.txt

  publish-package:
    runs-on: ${{ env.RUNNER }}
    needs: [build-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/
      - name: Publish to GitHub Packages
        run: make publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    runs-on: ${{ env.RUNNER }}
    needs: [build-package, export-requirements]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Download requirements
        uses: actions/download-artifact@v4
        with:
          name: requirements
          path: .
      - name: Build Docker image
        run: make docker-build
        env:
          DOCKER_TAG: ${{ github.sha }}

  tag-docker:
    runs-on: ${{ env.RUNNER }}
    needs: [build-docker]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Tag Docker image
        run: make tag-docker
        env:
          TAG: ${{ github.sha }}

  push-docker:
    runs-on: ${{ env.RUNNER }}
    needs: [tag-docker]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: make push-docker
        env:
          TAG: ${{ github.sha }}

  clean-after-push:
    runs-on: ${{ env.RUNNER }}
    needs: [push-docker]
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Clean Docker images
        run: make clean-docker
        env:
          TAG: ${{ github.sha }}

  notify:
    runs-on: ${{ env.RUNNER }}
    needs: [install-dependencies, run-linters, check-formatting, run-type-checking, run-unit-tests, generate-coverage-report, run-security-scan, build-package, export-requirements, publish-package, push-docker, clean-after-push]
    if: always()
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
      - name: Notify via issue comment
        run: make notify
        env:
          STATUS: ${{ job.status }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
